<!DOCTYPE html>
<html>
<head>
    <title>HTML Link Tag Demonstration</title>

    <!-- 1. Linking External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- 2. Linking Print CSS -->
    <link rel="stylesheet" href="print.css" media="print">

    <!-- 3. Adding Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">

    <!-- 4. Preloading a Resource -->
    <link rel="preload" href="style.css" as="style">

    <!-- 5. Linking External Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">

</head>

<body>

    <h1>Demonstration of Link Tag in HTML</h1>
    <p>This page shows different uses of the link tag.</p>

</body>
</html>
