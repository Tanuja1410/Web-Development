<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 13 - Student Performance (XSLT)</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            color: #0f172a;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
        }
        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .grade-pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .grade-A { background-color: #dcfce7; color: #166534; }
        .grade-B { background-color: #dbeafe; color: #1e40af; }
        .grade-C { background-color: #fef9c3; color: #854d0e; }
        .grade-D { background-color: #fee2e2; color: #991b1b; }
        
        .score {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Academic Performance Report</h1>
    <div id="output">Processing Records...</div>
</div>

<script>
// XML Data for Student Grades
const xmlData = `
<report>
    <student>
        <name>Ayaan Deshmukh</name>
        <roll>CS001</roll>
        <subject>Data Structures</subject>
        <marks>92</marks>
        <grade>A</grade>
    </student>
    <student>
        <name>Isha Kulkarni</name>
        <roll>CS002</roll>
        <subject>Database Management</subject>
        <marks>85</marks>
        <grade>B</grade>
    </student>
    <student>
        <name>Sameer Joshi</name>
        <roll>CS003</roll>
        <subject>Software Engineering</subject>
        <marks>78</marks>
        <grade>B</grade>
    </student>
    <student>
        <name>Ananya Rao</name>
        <roll>CS004</roll>
        <subject>Web Technology</subject>
        <marks>95</marks>
        <grade>A</grade>
    </student>
    <student>
        <name>Vikram Singh</name>
        <roll>CS005</roll>
        <subject>Computer Networks</subject>
        <marks>64</marks>
        <grade>C</grade>
    </student>
</report>
`;

// XSL Stylesheet for Student Grades
const xslData = `
<xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">
<xsl:template match="/">
    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Marks</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <xsl:for-each select="report/student">
            <xsl:sort select="marks" data-type="number" order="descending"/>
            <tr>
                <td><xsl:value-of select="roll"/></td>
                <td><strong><xsl:value-of select="name"/></strong></td>
                <td><xsl:value-of select="subject"/></td>
                <td class="score"><xsl:value-of select="marks"/></td>
                <td>
                    <span class="grade-pill grade-{grade}">
                        <xsl:value-of select="grade"/>
                    </span>
                </td>
            </tr>
            </xsl:for-each>
        </tbody>
    </table>
</xsl:template>
</xsl:stylesheet>
`;

function transform() {
    const parser = new DOMParser();
    try {
        const xml = parser.parseFromString(xmlData, "application/xml");
        const xsl = parser.parseFromString(xslData, "application/xml");

        if (window.XSLTProcessor) {
            const xsltProcessor = new XSLTProcessor();
            xsltProcessor.importStylesheet(xsl);
            const resultDocument = xsltProcessor.transformToFragment(xml, document);
            const output = document.getElementById("output");
            output.innerHTML = "";
            output.appendChild(resultDocument);
        } else {
            document.getElementById("output").innerHTML = "XSLT is not supported by this browser.";
        }
    } catch (e) {
        document.getElementById("output").innerHTML = "Error: " + e.message;
    }
}

window.onload = transform;
</script>

</body>
</html>
