  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Display Webpage</title>

    <!-- Internal CSS for styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
        }

        section {
            margin: 30px;
        }

        img {
            border: 5px solid #4CAF50;
            border-radius: 10px;
            margin-top: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 10px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Welcome to My Image Webpage</h1>
    </header>

    <!-- Main Content Section -->
    <section>
        <h2>Displaying an Image Using HTML</h2>

        <p>
            This webpage demonstrates how to insert and display an image 
            using the HTML &lt;img&gt; tag along with its attributes.
        </p>

        <!-- Image Tag -->
        <img src="sample.jpg" 
             alt="Beautiful Nature Image" 
             width="400" 
             height="300">

        <p>
            The above image is displayed using the <b>img</b> tag.
        </p>
    </section>

    <!-- Footer Section -->
    <footer>
        <p>Created using HTML</p>
    </footer>

</body>
</html>
